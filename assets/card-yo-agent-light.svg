<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="yo-agent：tau 之前的那一版通用 Agent Runtime终端、RPC、MCP、ACP、浏览器同一内核">
