<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="yophon：做 agent 内核，也拿它做自己天天在用的东西">
  <style>.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif } .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace }
@keyframes type { 0%, 3.57% { transform: translateX(0); animation-timing-function: steps(14, end) } 15.00%, 96% { transform: translateX(210px) } 97%, 100% { transform: translateX(0) } }
@keyframes fade { 0%, 91% { opacity: 1 } 95%, 100% { opacity: 0 } }
@keyframes l0 { 0%, 18.57% { opacity: 0 } 19.64%, 91% { opacity: 1 } 95%, 100% { opacity: 0 } }
@keyframes l1 { 0%, 25.00% { opacity: 0 } 26.07%, 91% { opacity: 1 } 95%, 100% { opacity: 0 } }
@keyframes l2 { 0%, 31.43% { opacity: 0 } 32.50%, 91% { opacity: 1 } 95%, 100% { opacity: 0 } }
@keyframes done { 0%, 39.29% { opacity: 0 } 40.36%, 91% { opacity: 1 } 95%, 100% { opacity: 0 } }
@keyframes next { 0%, 45.00% { opacity: 0 } 46.07%, 91% { opacity: 1 } 95%, 100% { opacity: 0 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes float { from { transform: translateY(0) } to { transform: translateY(-10px) } }
.cover { transform: translateX(210px); animation: type 14s linear infinite } .first { animation: fade 14s linear infinite }
.l0 { animation: l0 14s linear infinite }
.l1 { animation: l1 14s linear infinite }
.l2 { animation: l2 14s linear infinite }
.done { animation: done 14s linear infinite } .next { animation: next 14s linear infinite }
.cursor { animation: blink 1s steps(1) infinite }
.f0 { animation: float 4s ease-in-out infinite alternate } .f1 { animation: float 5s ease-in-out -2s infinite alternate } .f2 { animation: float 6s ease-in-out -1s infinite alternate }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.128"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <pattern id="iso" width="34.64" height="20" patternUnits="userSpaceOnUse"><path d="M0 0L34.64 20M0 20L34.64 0" stroke="rgba(71,85,105,0.08)" stroke-width="1"/></pattern>
    <radialGradient id="fadeMask"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gridMask"><rect width="1200" height="400" fill="url(#fadeMask)"/></mask>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
